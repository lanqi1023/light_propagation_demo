<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角谱法传播演示</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1>角谱法传播演示</h1>
    <div class="header-controls">
      <span class="mode-label">模式:</span>
      <span id="modeReal" class="mode-option active">实时 256×256</span>
      <span id="modeHQ" class="mode-option">高质量 512×512</span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <section class="param-group">
        <h3 class="group-title" data-target="gridParams">基础网格</h3>
        <div id="gridParams" class="group-body">
          <div class="field">
            <label>Nx, Ny</label>
            <select id="nxSelect"><option>64</option><option>128</option><option selected>256</option><option>512</option></select>
            <span class="sep">×</span>
            <select id="nySelect"><option>64</option><option>128</option><option selected>256</option><option>512</option></select>
          </div>
          <div class="field">
            <label>Δx (μm)</label>
            <input type="range" id="dxRange" min="1" max="50" value="10" step="1">
            <input type="number" id="dxNum" value="10" min="1" max="50" step="1">
          </div>
          <div class="field">
            <label>Δy (μm)</label>
            <input type="range" id="dyRange" min="1" max="50" value="10" step="1">
            <input type="number" id="dyNum" value="10" min="1" max="50" step="1">
          </div>
          <div class="field readonly">
            <label>Lx, Ly</label>
            <span id="lxDisplay">2.56</span><span class="unit">mm</span>
            <span class="sep">×</span>
            <span id="lyDisplay">2.56</span><span class="unit">mm</span>
          </div>
        </div>
      </section>

      <section class="param-group">
        <h3 class="group-title" data-target="apertureParams">光源与光阑</h3>
        <div id="apertureParams" class="group-body">
          <div class="field">
            <label>λ (nm)</label>
            <input type="range" id="lambdaRange" min="380" max="780" value="532" step="1">
            <input type="number" id="lambdaNum" value="532" min="380" max="780" step="1">
          </div>
          <div class="field radio-group">
            <label>光阑</label>
            <div class="radio-options">
              <label><input type="radio" name="aperture" value="slit" checked> 单缝</label>
              <label><input type="radio" name="aperture" value="doubleSlit"> 双缝</label>
              <label><input type="radio" name="aperture" value="circle"> 圆孔</label>
              <label><input type="radio" name="aperture" value="rectangle"> 矩形孔</label>
              <label><input type="radio" name="aperture" value="free"> 自由</label>
              <label><input type="radio" name="aperture" value="upload"> 上传</label>
            </div>
          </div>
          <div id="slitParams" class="aperture-params">
            <div class="field">
              <label>缝宽 a (μm)</label>
              <input type="range" id="slitWidthRange" min="10" max="500" value="100" step="1">
              <input type="number" id="slitWidthNum" value="100" min="10" max="500" step="1">
            </div>
          </div>
          <div id="doubleSlitParams" class="aperture-params" style="display:none">
            <div class="field">
              <label>缝宽 a (μm)</label>
              <input type="range" id="dsWidthRange" min="10" max="200" value="50" step="1">
              <input type="number" id="dsWidthNum" value="50" min="10" max="200" step="1">
            </div>
            <div class="field">
              <label>间距 d (μm)</label>
              <input type="range" id="dsSepRange" min="20" max="500" value="200" step="1">
              <input type="number" id="dsSepNum" value="200" min="20" max="500" step="1">
            </div>
          </div>
          <div id="circleParams" class="aperture-params" style="display:none">
            <div class="field">
              <label>半径 R (μm)</label>
              <input type="range" id="circleRadiusRange" min="10" max="500" value="100" step="1">
              <input type="number" id="circleRadiusNum" value="100" min="10" max="500" step="1">
            </div>
          </div>
          <div id="rectangleParams" class="aperture-params" style="display:none">
            <div class="field">
              <label>宽 a (μm)</label>
              <input type="range" id="rectWidthRange" min="10" max="500" value="150" step="1">
              <input type="number" id="rectWidthNum" value="150" min="10" max="500" step="1">
            </div>
            <div class="field">
              <label>高 b (μm)</label>
              <input type="range" id="rectHeightRange" min="10" max="500" value="150" step="1">
              <input type="number" id="rectHeightNum" value="150" min="10" max="500" step="1">
            </div>
          </div>
          <div id="uploadParams" class="aperture-params" style="display:none">
            <div class="field">
              <label>图片</label>
              <input type="file" id="imageUpload" accept="image/png,image/jpeg">
            </div>
          </div>
          <div class="field">
            <label>高斯 w₀ (mm)</label>
            <input type="range" id="w0Range" min="0" max="100" value="100" step="0.1">
            <input type="number" id="w0Num" value="100" min="0.1" max="100" step="0.1">
            <span class="unit-hint">∞=平面波</span>
          </div>
        </div>
      </section>

      <section class="param-group">
        <h3 class="group-title" data-target="propParams">传播参数</h3>
        <div id="propParams" class="group-body">
          <div class="field">
            <label>dz (mm)</label>
            <input type="range" id="dzRange" min="1" max="1000" value="100" step="1">
            <input type="number" id="dzNum" value="100" min="1" max="1000" step="1">
          </div>
        </div>
      </section>

      <section class="param-group">
        <h3 class="group-title" data-target="coherenceParams">退相干效应</h3>
        <div id="coherenceParams" class="group-body">
          <div class="field checkbox-field">
            <label><input type="checkbox" id="tiltEnable"> 偏轴照明</label>
          </div>
          <div id="tiltParams" style="display:none" class="sub-params">
            <div class="field">
              <label>θx (°)</label>
              <input type="range" id="tiltXRange" min="-10" max="10" value="0" step="0.1">
              <input type="number" id="tiltXNum" value="0" min="-10" max="10" step="0.1">
            </div>
            <div class="field">
              <label>θy (°)</label>
              <input type="range" id="tiltYRange" min="-10" max="10" value="0" step="0.1">
              <input type="number" id="tiltYNum" value="0" min="-10" max="10" step="0.1">
            </div>
          </div>
          <div class="field checkbox-field">
            <label><input type="checkbox" id="temporalCoherenceEnable"> 宽光谱 (时间相干)</label>
          </div>
          <div id="temporalParams" style="display:none" class="sub-params">
            <div class="field">
              <label>Δλ (nm)</label>
              <input type="range" id="deltaLambdaRange" min="0" max="200" value="20" step="1">
              <input type="number" id="deltaLambdaNum" value="20" min="0" max="200" step="1">
            </div>
            <div class="field">
              <label>采样数 M</label>
              <select id="mSelect">
                <option value="1">1 (单色)</option>
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="7">7</option>
              </select>
            </div>
          </div>
          <div class="field checkbox-field">
            <label><input type="checkbox" id="spatialCoherenceEnable"> 扩展光源 (空间相干)</label>
          </div>
          <div id="spatialParams" style="display:none" class="sub-params">
            <div class="field">
              <label>方向数 K</label>
              <select id="kSelect">
                <option value="1">1 (点光源)</option>
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="7">7</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <div class="action-buttons">
        <div class="field">
          <label>扫参</label>
          <select id="sweepVar">
            <option value="dz">dz</option>
            <option value="lambda">λ</option>
          </select>
          <button id="playBtn">▶</button>
        </div>
        <div class="field">
          <button id="screenshotBtn">📷 截图</button>
          <button id="resetBtn">⟲ 重置</button>
        </div>
      </div>
    </aside>

    <div class="visualization">
      <div class="canvas-row">
        <div class="canvas-card">
          <div class="card-label">输入光阑</div>
          <canvas id="inputCanvas" width="256" height="256"></canvas>
        </div>
        <div class="canvas-card">
          <div class="card-label">强度图</div>
          <canvas id="intensityCanvas" width="256" height="256"></canvas>
        </div>
        <div class="canvas-card">
          <div class="card-label">相位图</div>
          <canvas id="phaseCanvas" width="256" height="256"></canvas>
        </div>
      </div>

      <div class="cross-section-row">
        <canvas id="crossCanvas" width="800" height="180"></canvas>
      </div>

      <div id="comparisonRow" class="comparison-row" style="display:none">
        <div class="canvas-card">
          <div class="card-label">理想</div>
          <canvas id="idealCanvas" width="256" height="256"></canvas>
        </div>
        <div class="canvas-card">
          <div class="card-label">当前</div>
          <canvas id="currentCanvas" width="256" height="256"></canvas>
        </div>
        <div class="canvas-card">
          <div class="card-label">差值 |ΔI|</div>
          <canvas id="diffCanvas" width="256" height="256"></canvas>
        </div>
      </div>

      <div class="dashboard">
        <div class="dash-item"><span class="dash-label">采样:</span><span id="samplingStatus" class="dash-value ok">✓ 充足</span></div>
        <div class="dash-item"><span class="dash-label">F:</span><span id="fresnelDisplay" class="dash-value">—</span></div>
        <div class="dash-item"><span class="dash-label">Lx:</span><span id="dashLx" class="dash-value">—</span></div>
        <div class="dash-item"><span class="dash-label">Ly:</span><span id="dashLy" class="dash-value">—</span></div>
        <div class="dash-item"><span class="dash-label">耗时:</span><span id="timeDisplay" class="dash-value">—</span></div>
        <div class="dash-item"><span class="dash-label">N:</span><span id="dashN" class="dash-value">256</span></div>
      </div>
    </div>
  </div>

  <footer class="status-bar">
    <span id="statusMessage">就绪</span>
  </footer>
</div>

<script src="/static/colormap.js"></script>
<script src="/static/app_shell.js"></script>
</body>
</html>
