[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incoherent-metasurface-modes"
version = "0.2.0"
description = "Diagnostics and differentiable propagation for incoherent MicroLED metasurface processors"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]
torch = ["torch>=2.1"]
viz = ["matplotlib>=3.8"]

[project.scripts]
mode-overlap = "metasurface_modes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
